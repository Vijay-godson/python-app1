name: python-app1-cicd

on:
  push:
    #paths:
     # - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      #commit_id: "${{ env.COMMIT_ID }}"
      commit_id: "${{ steps.sha_step.outputs.commit_id }}"
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set Short SHA
        id: sha_step
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-6)
          
          echo "COMMIT_ID=${SHORT_SHA}" >> $GITHUB_ENV
          echo "commit_id=${SHORT_SHA}" >> $GITHUB_OUTPUT
          

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: "vijaygodson/python-app1:${{ env.COMMIT_ID }}"

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: modify values.yaml file for argocd
        shell: bash
        run: |
          echo "updating with ${{ needs.ci.outputs.commit_id }}"
          if ! command -v pip3 &> /dev/null; then
            echo 'pip not found. Installing pip3'
            sudo apt-get update && sudo apt-get install python3-pip wget -y
          else
            echo 'pip3 is already installed'
          fi

          if ! command -v yq &> /dev/null; then
            echo 'yq not found. Installing yq'
            sudo curl -Lo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          else
            echo 'yq is already installed'
          fi

          yq eval '.image.tag = "${{ needs.ci.outputs.commit_id }}"' -i charts/python-app1/values-dev.yaml

      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'updates values.yaml wit commit '

      - name: Install argocd-server
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64 
          chmod +x argocd 
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username "${{ secrets.ARGOCD_USERNAME }}" \
            --password "${{ secrets.ARGOCD_PASSWORD}}"

      - name: Ensure argocd repo, app and sync
        shell: bash
        run: |
          repo="https://github.com/Vijay-godson/python-app1.git"
          argocd repo list | grep -q $repo || argocd repo add $repo
          argocd app get python-app1 || argocd app create python-app1 --repo $repo --path "charts/python-app1" --dest-namespace "dev" --dest-server "https://kubernetes.default.svc" --values "values-dev.yaml" --revision "main" --sync-policy "manual" --sync-option "CreateNamespace=true"
          argocd app sync python-app1
          argocd app wait python-app1 --timeout 180